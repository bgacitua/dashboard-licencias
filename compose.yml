name: dashboard-licencias

networks:
  # Red interna entre backend y frontend
  internal:
    driver: bridge
  # Red externa compartida con Caddy para recibir tráfico HTTPS
  # Crear antes del primer deploy: docker network create proxy
  proxy:
    external: true

services:
  backend:
    # TAG lo fija el workflow al SHA del commit, para poder volver a la imagen anterior
    # si el deploy falla. Sin TAG (build local, rollback manual) usa :latest.
    image: ghcr.io/bgacitua/dashboard-licencias-backend:${TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dashboard-licencias-backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - ./data:/app/data
    # host.docker.internal: alcanzar el PostgreSQL instalado directamente en la VPS.
    # n8n.cramer.cl: el DNS interno no llega al contenedor, y usar la IP en la URL
    # rompe la validación del certificado del webhook.
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "n8n.cramer.cl:192.9.200.12"
    networks:
      - internal
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ghcr.io/bgacitua/dashboard-licencias-frontend:${TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dashboard-licencias-frontend
    restart: unless-stopped
    networks:
      - internal
      - proxy
    expose:
      - "80"
    # Expuesto solo en loopback del host para que nginx (host) pueda hacer
    # reverse-proxy desde http://personas.cramer.cl. Caddy sigue accediendo
    # vía red `proxy` para servir HTTPS en :8444 (OAuth Microsoft).
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      backend:
        condition: service_healthy
