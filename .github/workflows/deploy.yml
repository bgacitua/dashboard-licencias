# Build empuja imágenes a GHCR; deploy solo las baja y recrea los contenedores.
# El downtime es el de recrear con la imagen ya descargada (segundos), no el del
# build (minutos: ODBC + Playwright/Chromium).
#
# Ambos jobs corren en el act_runner containerizado (label `ubuntu-latest`), que
# inyecta el docker.sock del host: el deploy controla el docker del host a través
# de ese socket, sin depender de un checkout en la VPS. compose.yml llega por el
# checkout del job; backend/.env por el secret DASHBOARD_ENV; los datos (/app/data,
# ms_token.json) viven en un named volume, no en un bind al host.
#
# Secrets del repo (una sola vez):
#   - GHCR_TOKEN   PAT de GitHub con write:packages (en GitHub cae al automático).
#   - DASHBOARD_ENV  contenido COMPLETO de backend/.env de producción.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Fijo, no derivado de github.repository: en Gitea el repo se llama distinto
  # (plataforma-personas) y las imágenes saldrían con otro nombre, pero compose.yml
  # pide ghcr.io/bgacitua/dashboard-licencias-*. Pinearlo hace que GitHub y Gitea
  # publiquen y consuman exactamente la misma imagen.
  IMAGE_BASE: ghcr.io/bgacitua/dashboard-licencias

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      # El contenedor del act_runner (catthehacker) no trae el CLI de docker, que
      # login-action, setup-buildx y build-push necesitan. En GitHub venía con el
      # runner; acá se instala el binario estático. El daemon es el del host, que
      # el act_runner inyecta por docker.sock.
      - name: Instalar docker CLI
        run: |
          set -e
          DOCKER_VER=28.0.4
          curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_VER}.tgz" \
            | tar -xz -C /usr/local/bin --strip-components=1 docker/docker
          docker --version
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # En GitHub el GITHUB_TOKEN automático basta para GHCR; en Gitea ese
          # token es de su propia API y no sirve, así que ahí se usa el PAT
          # GHCR_TOKEN (write:packages). El `||` toma GHCR_TOKEN si existe y cae
          # al automático si no, así el mismo workflow corre en ambos.
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_BASE }}-${{ matrix.service }}:${{ github.sha }}
          # Cache en el registry: las capas de ODBC y Chromium no se rebuildean
          # salvo que cambie el Dockerfile o requirements.txt.
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}-${{ matrix.service }}:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # El job corre en un contenedor con el docker.sock del host inyectado por el
    # act_runner, así controla el docker del host sin depender de un checkout en
    # la VPS: compose.yml llega por el checkout del job y backend/.env por secret.
    # NO montar el sock acá (el runner ya lo inyecta: hacerlo de nuevo da
    # "Duplicate mount point"). node:20 trae git + curl para el checkout.
    container:
      image: node:20-bookworm
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar docker CLI + compose
        run: |
          set -e
          DOCKER_VER=28.0.4
          curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_VER}.tgz" \
            | tar -xz -C /usr/local/bin --strip-components=1 docker/docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          COMPOSE_VER=v2.33.1
          curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VER}/docker-compose-linux-x86_64"
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          docker version
          docker compose version

      - name: Login a GHCR
        run: echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # backend/.env ya no vive en el host: lo reconstruye el secret en cada deploy.
      - name: Preparar backend/.env desde el secret
        run: |
          mkdir -p backend
          printf '%s' "${{ secrets.DASHBOARD_ENV }}" > backend/.env

      # El tag de lo que está corriendo AHORA, para poder volver si el deploy falla.
      - name: Anotar versión actual
        id: actual
        run: |
          prev=$(docker inspect --format '{{.Config.Image}}' dashboard-licencias-backend 2>/dev/null | sed 's/.*://')
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
      - name: Pull de imágenes
        run: docker compose pull
      # --wait espera el healthcheck del backend: si la imagen nueva no levanta, falla acá.
      - name: Recrear contenedores
        run: docker compose up -d --wait --remove-orphans
      # Solo corre si el paso anterior falló. La imagen previa sigue en disco (estaba
      # en uso hace segundos), así que volver a ella no depende de la red.
      - name: Rollback
        if: failure() && steps.actual.outputs.tag != ''
        env:
          TAG: ${{ steps.actual.outputs.tag }}
        run: |
          echo "Deploy falló, volviendo a $TAG"
          docker compose up -d --wait --remove-orphans
      # Después del rollback las imágenes rotas quedan sin tag en uso: prune las borra.
      - name: Limpiar imágenes viejas
        if: always()
        run: docker image prune -f
