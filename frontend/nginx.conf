server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Comprimir lo que se sirve. Los bundles grandes (Costos 455 kB, xlsx 425 kB)
    # bajan a ~126 kB y ~142 kB.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Headers de seguridad. Sin CSP a propósito: la app carga fuentes e iconos
    # de Google y usa estilos inline, así que una policy escrita a ciegas rompe
    # la interfaz. Agregarla pide medirla antes en Report-Only.
    #
    # OJO: nginx no acumula add_header. Un `location` que declare uno propio
    # descarta TODOS los del server, así que estos tres se repiten en cada
    # bloque que agrega cabeceras. Si se toca uno, tocar los tres lugares.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Los assets de Vite llevan hash en el nombre: un cambio genera otro archivo,
    # así que se pueden cachear para siempre sin riesgo de servir algo viejo.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html NO se cachea: es lo que apunta a los assets nuevos tras un
    # deploy. Cacheado, el navegador seguiría pidiendo bundles que ya no existen.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    # SPA routing: todas las rutas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al backend para todas las llamadas a la API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
